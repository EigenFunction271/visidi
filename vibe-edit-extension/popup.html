<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 240px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 12px;
        color: #111827;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        color: #4b5563;
        margin: 0 0 10px;
        line-height: 1.4;
      }
      button {
        width: 100%;
        font-size: 13px;
        padding: 8px;
        border-radius: 6px;
        border: none;
        background: #3b82f6;
        color: white;
        cursor: pointer;
      }
      button:hover {
        background: #2563eb;
      }
      #file-warning {
        display: none;
        margin-top: 10px;
        font-size: 11px;
        background: #fef3c7;
        color: #92400e;
        padding: 8px;
        border-radius: 6px;
        line-height: 1.4;
      }
      #file-warning a {
        color: #92400e;
        font-weight: 600;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Vibe Edit Picker</h1>
    <p>Click the button, then click any element on the page to capture it.</p>
    <button id="activate-btn">Pick an element</button>
    <div id="file-warning">
      This page is a local file (file://). Vibe Edit Picker needs file URL
      access — enable it at
      <a id="extensions-link" href="#">chrome://extensions</a> under "Allow
      access to file URLs."
    </div>
    <script src="popup.js"></script>
  </body>
</html>
